# Leadership Team — shown on the Leadership Team page in both languages.
# Edit in Pages CMS under "Leadership Team". Photos are shown as circles, so a square photo works best.
members:
  - name: Alejandra Quiroz Hernández
    photo: /assets/uploads/2024/02/EBIR_QUHA.png
    wikimedia_user: Alequihdez
    en:
      country: Mexico
      bio: Librarian and picture book publisher. Wikimedian since 2022.
      book: "Primero sueño by Sor Juana Inés de la Cruz (colonial Mexican writer)"
    pt:
      country: México
      bio: Bibliotecária e editora de livros ilustrados. Wikimedista desde 2022.
      book: "Primero sueño, de Sor Juana Inés de la Cruz (escritora mexicana do período colonial)"

  - name: Laurie Bridges
    photo: /assets/uploads/2024/02/0_0_125_125_Laurie_Bridges-245x300.jpg
    wikimedia_user: Bridges2Information
    en:
      country: USA
      bio: Librarian at Oregon State University. Wikimedian since 2018. Co-coordinated the first Wikimedia and Libraries Convention in Maynooth, Ireland, in 2022.
      book: "Parable of the Sower by Octavia Butler (American author)"
    pt:
      country: Estados Unidos
      bio: Bibliotecária na Oregon State University. Wikimedista desde 2018. Coordenou a primeira Convenção Wikimedia e Bibliotecas em Maynooth, Irlanda, em 2022.
      book: "A parábola do semeador, de Octavia Butler (escritora estadunidense)"

  - name: Lilian Viana
    photo: /assets/uploads/2024/02/0_0_125_125_Foto-perfil-2021-200x300.jpg
    wikimedia_user: Lilian Viana
    en:
      country: Brazil
      bio: Librarian, Wikimedian and PhD in Information Science. Contributes mostly to Wikipedia in Portuguese and Wikidata.
      book: "Crime do cais do Valongo by Eliana Alves Cruz (Brazilian writer)"
    pt:
      country: Brasil
      bio: Bibliotecária atuante na Universidade de São Paulo, wikimedista e doutora em Ciência da Informação. Contribui principalmente para a Wikipédia em português e o Wikidata.
      book: "Crime do cais do Valongo, de Eliana Alves Cruz (escritora brasileira)"

  - name: Martín Tena Espinoza de los Monteros
    photo: /assets/uploads/2024/02/EBIR_MATEM.png
    wikimedia_user: Mtenaespinoza
    en:
      country: Mexico
      bio: PhD in Education in the Knowledge Society from the University of Salamanca (Spain). Professor at the University of Guadalajara and librarian in its University Library System. Works on open science, open access and Wikimedia projects, and promotes open education and civic innovation. Member of the CLACSO Working Group on Open Science as a Common Good.
      book: "Elogio del caminar by David Le Breton (French anthropologist)"
    pt:
      country: México
      bio: Doutor em Educação na Sociedade do Conhecimento pela Universidade de Salamanca (Espanha). Professor na Universidade de Guadalajara e bibliotecário no Sistema de Bibliotecas Universitárias. Participa de projetos de ciência aberta, acesso aberto e Wikimedia, além de promover a educação aberta e a inovação cívica. Membro do Grupo de Trabalho CLACSO sobre Ciência Aberta como Bem Comum.
      book: "Elogio del caminar, de David Le Breton (antropólogo francês)"

  - name: Stela Madruga
    photo: /assets/uploads/2024/03/20230203_102232-scaled-e1709819900585-150x150.jpg
    wikimedia_user: Ssstela
    en:
      country: Brazil
      bio: Librarian at the University of São Paulo (USP) and Head of the IME-USP Library. Wikimedian since 2019, with a master's in Information Science. Contributes mainly to Portuguese Wikipedia and Wikidata.
      book: "Quarto de despejo by Carolina Maria de Jesus (Brazilian author)"
    pt:
      country: Brasil
      bio: Bibliotecária na Universidade de São Paulo (USP) e chefe da Biblioteca do IME-USP. Wikimedista desde 2019 e mestre em Ciência da Informação. Contribui principalmente para a Wikipédia em português e o Wikidata.
      book: "Quarto de despejo, de Carolina Maria de Jesus (escritora brasileira)"
